<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal</title>
<link rel="stylesheet" href="../lib/app.css">
<style>
  body { background: #070A16; }
  :root[data-theme="light"] body { background: #0B1020; }
  .term { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px 4px; font: 13px/1.55 var(--font-mono); color: #DCE3F0; user-select: text; -webkit-user-select: text; white-space: pre-wrap; word-break: break-word; }
  .term .p { color: #2DD4BF; } .term .d { color: #7DA2FF; } .term .w { color: #F6C08C; } .term .e { color: #FF7A7A; } .term .m { color: #8792AD; }
  .term a { color: #2DD4BF; cursor: pointer; }
  .line { display: flex; gap: 8px; align-items: center; padding: 4px 14px 12px; font: 13px/1.55 var(--font-mono); background: #070A16; }
  :root[data-theme="light"] .line { background: #0B1020; }
  .line .p { color: #2DD4BF; white-space: nowrap; }
  .line input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #EEF2F8; font: inherit; padding: 4px 0; }
  .keys { display: flex; gap: 6px; padding: 0 12px 8px; overflow-x: auto; background: #070A16; }
  .keys button { flex: none; border: 1px solid rgba(255,255,255,.14); background: transparent; color: #C9D2E6; border-radius: 8px; padding: 4px 10px; font: 12px var(--font-mono); cursor: pointer; }
  @media (min-width: 641px) { .keys { display: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="term" id="out" aria-live="polite"></div>
  <div class="line"><span class="p" id="ps"></span><input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Befehl"></div>
  <div class="keys" id="keys"></div>
</div>
<script src="../lib/app.js"></script>
<script>
(function () {
  'use strict';
  var el = A.el, fs = A.fs, HX = A.HX;
  var out = document.getElementById('out'), inp = document.getElementById('in'), ps = document.getElementById('ps');
  var T = { root: 'home', cwd: '', hist: [], hi: 0, tail: null };
  try { T.hist = JSON.parse(localStorage.getItem('term.hist') || '[]'); } catch (e) { }
  T.hi = T.hist.length;

  function print(text, cls) { out.appendChild(el('div', { class: cls || null, text: text })); out.scrollTop = out.scrollHeight; }
  function printNode(n) { out.appendChild(n); out.scrollTop = out.scrollHeight; }
  function prompt() { ps.textContent = (T.root === 'home' ? '~' : T.root + ':') + (T.cwd ? '/' + T.cwd : '') + ' $'; }
  function resolve(p) {
    if (!p) return T.cwd;
    var parts = (p.charAt(0) === '/' ? [] : T.cwd ? T.cwd.split('/') : []);
    p.split('/').forEach(function (x) { if (!x || x === '.') return; if (x === '..') parts.pop(); else parts.push(x); });
    return parts.join('/');
  }
  function args(line) {
    var out = [], m, re = /"([^"]*)"|'([^']*)'|(\S+)/g;
    while ((m = re.exec(line))) out.push(m[1] != null ? m[1] : m[2] != null ? m[2] : m[3]);
    return out;
  }

  var CMDS = {
    hilfe: { d: 'Diese Übersicht', run: function () {
      Object.keys(CMDS).sort().forEach(function (k) { if (CMDS[k].d) print(('  ' + k + (CMDS[k].a ? ' ' + CMDS[k].a : '')).padEnd(26) + CMDS[k].d); });
    } },
    apps: { d: 'Installierte Apps', run: function () {
      HX.apps.all().forEach(function (a) { print('  ' + (a.id).padEnd(22) + a.name + (a.version ? '  ' + a.version : ''), a.system ? 'm' : null); });
    } },
    oeffne: { a: '<app> [seite]', d: 'App öffnen (id, Name oder Suite)', run: function (x) {
      if (!x[0]) return print('Welche App? Siehe „apps“.', 'w');
      if (!A.open(x[0], x[1] || null)) print('Keine App „' + x[0] + '“.', 'e');
    } },
    ls: { a: '[ordner]', d: 'Ordnerinhalt', run: function (x) {
      return fs.list(T.root, resolve(x[0])).then(function (r) {
        var list = r.entries.sort(function (a, b) { return (b.dir - a.dir) || a.name.localeCompare(b.name, 'de'); });
        if (!list.length) print('(leer)', 'm');
        list.forEach(function (e) { print(e.dir ? e.name + '/' : (e.name.padEnd(36) + ' ' + A.fmt.bytes(e.size)), e.dir ? 'd' : null); });
      });
    } },
    cd: { a: '<ordner>', d: 'Ordner wechseln (orte: cd @<ort>)', run: function (x) {
      if (!x[0] || x[0] === '~') { T.root = 'home'; T.cwd = ''; prompt(); return; }
      if (x[0].charAt(0) === '@') { T.root = x[0].slice(1) || 'home'; T.cwd = ''; prompt(); return; }
      var p = resolve(x[0]);
      return fs.stat(T.root, p).then(function (s) { if (!s.dir) throw new Error('Kein Ordner'); T.cwd = p; prompt(); });
    } },
    orte: { d: 'Speicherorte (für cd @ort)', run: function () {
      return fs.roots().then(function (r) { r.forEach(function (x) { print('  @' + x.id.padEnd(20) + x.name, 'd'); }); });
    } },
    pwd: { d: 'Aktueller Ordner', run: function () { print(T.root + ':/' + T.cwd); } },
    cat: { a: '<datei>', d: 'Datei anzeigen', run: function (x) {
      if (!x[0]) return print('Welche Datei?', 'w');
      return fs.read(T.root, resolve(x[0]), 'text').then(function (t) { print(t.length > 200000 ? t.slice(0, 200000) + '\n… (gekürzt)' : t); });
    } },
    mkdir: { a: '<name>', d: 'Ordner anlegen', run: function (x) { return fs.mkdir(T.root, resolve(x[0])).then(function () { print('angelegt', 'm'); }); } },
    rm: { a: '<pfad>', d: 'Datei oder Ordner löschen (fragt nach)', run: function (x) {
      var p = resolve(x[0]);
      if (!x[0] || !p) return print('Was soll gelöscht werden?', 'w');
      return A.confirm({ title: '„' + p + '“ löschen?', ok: 'Löschen', danger: true }).then(function (ok) { if (ok) return fs.remove(T.root, p).then(function () { print('gelöscht', 'm'); }); });
    } },
    schreib: { a: '<datei> <text>', d: 'Text in Datei schreiben', run: function (x) { return fs.write(T.root, resolve(x[0]), x.slice(1).join(' ') + '\n').then(function () { print('gespeichert', 'm'); }); } },
    edit: { a: '<datei>', d: 'Im Editor öffnen', run: function (x) { A.openFile(T.root, resolve(x[0]), 'sys:editor'); } },
    dateien: { d: 'Aktuellen Ordner in Dateien öffnen', run: function () { A.open('sys:files', { root: T.root, path: T.cwd }); } },
    logs: { a: '[app]', d: 'Konsolen-Ausgaben der Apps, live', run: function (x) { startTail(x[0] || ''); } },
    stopp: { d: 'Live-Ausgabe beenden', run: function () { stopTail(); print('beendet', 'm'); } },
    'logs-leeren': { d: 'Gespeicherte Ausgaben löschen', run: function () { return A.api('/api/system/logs', { method: 'DELETE' }).then(function () { print('geleert', 'm'); }); } },
    info: { d: 'Gerät und Helix', run: function () {
      return A.api('/api/system/info').then(function (i) { Object.keys(i).forEach(function (k) { print('  ' + k.padEnd(18) + i[k]); }); });
    } },
    installiere: { a: '<url>', d: 'Paket aus dem Netz holen und im App-Center zeigen', run: function (x) {
      if (!x[0]) return print('Adresse fehlt.', 'w');
      print('lade …', 'm');
      return A.api('/api/packages/fetch', { method: 'POST', json: { url: x[0] } }).then(function (r) { print(r.label + ' ' + (r.version || '') + ', ' + r.files + ' Dateien', 'p'); A.open('sys:appcenter', { package: r.id }); });
    } },
    stil: { a: 'dunkel|amoled|mono|hell|auto', d: 'Erscheinungsbild', run: function (x) { var m = { dunkel: 'dark', amoled: 'amoled', mono: 'mono', hell: 'light', auto: 'auto' }[x[0]]; if (!m) return print('dunkel, amoled, mono, hell oder auto', 'w'); HX.prefs.set('theme', m); } },
    datum: { d: 'Datum und Uhrzeit', run: function () { print(new Date().toLocaleString('de-DE', { dateStyle: 'full', timeStyle: 'medium' })); } },
    echo: { a: '<text>', d: 'Text ausgeben', run: function (x) { print(x.join(' ')); } },
    leeren: { d: 'Bildschirm leeren', run: function () { A.clear(out); } },
    'neu-laden': { d: 'Desktop neu laden', run: function () { HX.shell.reload(); } },
    js: { a: '<ausdruck>', d: 'JavaScript im Terminal auswerten', run: function (x, raw) {
      var code = raw.replace(/^\s*js\s+/, '');
      try { var v = (0, eval)(code); return Promise.resolve(v).then(function (r) { print(fmtVal(r), 'p'); }); } catch (e) { print(e.message, 'e'); }
    } }
  };
  CMDS['öffne'] = CMDS.oeffne; CMDS.help = { run: CMDS.hilfe.run }; CMDS.clear = { run: CMDS.leeren.run };
  CMDS.open = { run: CMDS.oeffne.run };
  function fmtVal(v) { try { return typeof v === 'string' ? v : JSON.stringify(v, null, 2) || String(v); } catch (e) { return String(v); } }

  function startTail(app) {
    stopTail();
    var since = 0, first = true;
    print('Konsolen-Ausgaben' + (app ? ' von ' + app : '') + '. „stopp“ beendet.', 'm');
    var poll = function () {
      A.api('/api/system/logs?' + new URLSearchParams({ app: app, since: since })).then(function (r) {
        var lines = r.lines || [];
        if (first && lines.length > 200) lines = lines.slice(-200);
        first = false;
        lines.forEach(function (l) {
          var cls = l.level === 'error' ? 'e' : l.level === 'warn' || l.level === 'warning' ? 'w' : null;
          print(new Date(l.t).toLocaleTimeString('de-DE') + ' ' + (l.app || '-') + ' ' + l.msg + (l.src ? '  (' + l.src.split('/').pop() + ':' + l.line + ')' : ''), cls);
        });
        since = r.seq;
      }).catch(function (e) { print(A.errText(e), 'e'); stopTail(); });
    };
    poll();
    T.tail = setInterval(poll, 1500);
  }
  function stopTail() { if (T.tail) clearInterval(T.tail); T.tail = null; }

  function run(line) {
    print((ps.textContent) + ' ' + line, 'p');
    if (!line.trim()) return;
    T.hist.push(line); if (T.hist.length > 100) T.hist.shift(); T.hi = T.hist.length;
    try { localStorage.setItem('term.hist', JSON.stringify(T.hist)); } catch (e) { }
    var x = args(line), c = CMDS[x[0].toLowerCase()];
    if (!c) { print('Unbekannter Befehl „' + x[0] + '“. „hilfe“ zeigt alle.', 'e'); return; }
    inp.disabled = true;
    Promise.resolve().then(function () { return c.run(x.slice(1), line); })
      .catch(function (e) { print(A.errText(e), 'e'); })
      .then(function () { inp.disabled = false; inp.focus(); });
  }
  inp.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { var v = inp.value; inp.value = ''; run(v); }
    else if (e.key === 'ArrowUp') { if (T.hi > 0) inp.value = T.hist[--T.hi]; e.preventDefault(); }
    else if (e.key === 'ArrowDown') { inp.value = T.hi < T.hist.length - 1 ? T.hist[++T.hi] : (T.hi = T.hist.length, ''); e.preventDefault(); }
    else if (e.key === 'Tab') {
      e.preventDefault();
      var v = inp.value, hits = Object.keys(CMDS).filter(function (k) { return k.indexOf(v) === 0; });
      if (hits.length === 1) inp.value = hits[0] + ' ';
      else if (hits.length) print(hits.join('  '), 'm');
    } else if (e.ctrlKey && e.key === 'c') { stopTail(); print('^C', 'm'); }
    else if (e.ctrlKey && e.key === 'l') { e.preventDefault(); A.clear(out); }
  });
  document.addEventListener('click', function () { if (!window.getSelection().toString()) inp.focus(); });
  var keys = document.getElementById('keys');
  ['hilfe', 'ls', 'cd ..', 'apps', 'logs', 'stopp', '↑'].forEach(function (k) {
    keys.appendChild(el('button', { type: 'button', text: k, onclick: function (ev) {
      ev.stopPropagation();
      if (k === '↑') { if (T.hi > 0) inp.value = T.hist[--T.hi]; inp.focus(); return; }
      run(k);
    } }));
  });
  window.addEventListener('pagehide', stopTail);
  A.onNavigate(function (p) { if (p.get('cmd')) run(p.get('cmd')); });

  prompt();
  print('Helix-Terminal. „hilfe“ zeigt alle Befehle.', 'm');
  if (!fs) print('Ohne Helix-Server gehen nur wenige Befehle.', 'w');
  if (A.params.get('cmd')) run(A.params.get('cmd'));
  inp.focus();
})();
</script>
</body>
</html>
