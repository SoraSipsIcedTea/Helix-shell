<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uhr</title>
<link rel="stylesheet" href="../lib/app.css">
<style>
  .tabs { display: flex; justify-content: center; padding: 10px; border-bottom: 1px solid var(--line); }
  .pane { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 18px; display: flex; flex-direction: column; align-items: center; }
  .big { font-family: var(--font-display); font-weight: 300; font-size: clamp(48px, 15vw, 84px); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .sub { color: var(--mist); margin: 8px 0 22px; font-family: var(--font-display); }
  .cities { width: 100%; max-width: 440px; }
  .ring { width: 220px; height: 220px; position: relative; margin: 6px 0 20px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .big { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 46px; }
  .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btns .btn { min-width: 110px; min-height: 44px; border-radius: 22px; }
  .laps { width: 100%; max-width: 360px; margin-top: 18px; font-variant-numeric: tabular-nums; }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 18px; }
  .chip { border: 1px solid var(--line-strong); background: transparent; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .chip:hover { background: var(--raised); }
</style>
</head>
<body>
<div class="app">
  <div class="tabs" id="tabs"></div>
  <div class="pane" id="pane"></div>
</div>
<script src="../lib/app.js"></script>
<script>
(function () {
  'use strict';
  var el = A.el, icon = A.icon, pane = document.getElementById('pane');
  var cur = 'clock', timer = null;
  var CITIES = [['Berlin', 'Europe/Berlin'], ['London', 'Europe/London'], ['New York', 'America/New_York'], ['Los Angeles', 'America/Los_Angeles'], ['Tokio', 'Asia/Tokyo'], ['Sydney', 'Australia/Sydney']];
  // Stoppuhr und Timer laufen weiter, auch wenn man den Reiter wechselt.
  var SW = { start: 0, acc: 0, run: false, laps: [] };
  var TM = { total: 300000, end: 0, left: 300000, run: false, done: null };

  document.getElementById('tabs').appendChild(A.seg([['clock', 'Weltzeit'], ['stop', 'Stoppuhr'], ['timer', 'Timer']], cur, function (v) { cur = v; render(); }));
  function pad(n) { return String(n).padStart(2, '0'); }
  function fmtMs(ms, cs) {
    ms = Math.max(0, ms);
    var h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60, s = Math.floor(ms / 1000) % 60, c = Math.floor(ms / 10) % 100;
    return (h ? h + ':' + pad(m) : pad(m)) + ':' + pad(s) + (cs ? ',' + pad(c) : '');
  }
  function render() {
    clearInterval(timer);
    A.clear(pane);
    if (cur === 'clock') clockView(); else if (cur === 'stop') stopView(); else timerView();
  }
  function clockView() {
    var big = el('div.big'), sub = el('div.sub'), g = el('div.group.cities');
    pane.append(big, sub, g);
    var rows = CITIES.map(function (c) { var t = el('span.mono'); g.appendChild(el('div.row', null, el('div.t', null, el('b', { text: c[0] }), el('small', { text: c[1] })), t)); return [c, t]; });
    var tick = function () {
      var d = new Date();
      big.textContent = d.toLocaleTimeString('de-DE');
      sub.textContent = d.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      rows.forEach(function (r) { r[1].textContent = d.toLocaleTimeString('de-DE', { timeZone: r[0][1], hour: '2-digit', minute: '2-digit', weekday: 'short' }); });
    };
    tick(); timer = setInterval(tick, 1000);
  }
  function stopView() {
    var big = el('div.big', { style: { margin: '30px 0 26px' } });
    var bStart = el('button.btn.primary', { type: 'button' }), bLap = el('button.btn', { type: 'button' });
    var laps = el('div.group.laps');
    pane.append(big, el('div.btns', null, bLap, bStart), laps);
    var now = function () { return SW.acc + (SW.run ? Date.now() - SW.start : 0); };
    var paint = function () {
      bStart.textContent = SW.run ? 'Anhalten' : SW.acc ? 'Weiter' : 'Start';
      bLap.textContent = SW.run ? 'Runde' : 'Zurücksetzen';
      bLap.disabled = !SW.run && !SW.acc;
      A.clear(laps); laps.hidden = !SW.laps.length;
      SW.laps.slice().reverse().forEach(function (l, i) { laps.appendChild(el('div.row', null, el('div.t', null, el('b', { text: 'Runde ' + (SW.laps.length - i) })), el('span.mono', { text: fmtMs(l, true) }))); });
    };
    bStart.onclick = function () { if (SW.run) { SW.acc = now(); SW.run = false; } else { SW.start = Date.now(); SW.run = true; } paint(); };
    bLap.onclick = function () { if (SW.run) SW.laps.push(now() - SW.laps.reduce(function (a, b) { return a + b; }, 0)); else { SW.acc = 0; SW.laps = []; } paint(); };
    var tick = function () { big.textContent = fmtMs(now(), true); };
    paint(); tick(); timer = setInterval(tick, 50);
  }
  function timerView() {
    var R = 100, C = 2 * Math.PI * R;
    var arc = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 220 220');
    svg.innerHTML = '<circle cx="110" cy="110" r="100" fill="none" stroke="var(--line)" stroke-width="8"/>';
    [['cx', 110], ['cy', 110], ['r', R], ['fill', 'none'], ['stroke', 'var(--peach)'], ['stroke-width', 8], ['stroke-linecap', 'round'], ['stroke-dasharray', C]].forEach(function (a) { arc.setAttribute(a[0], a[1]); });
    svg.appendChild(arc);
    var big = el('div.big');
    var presets = el('div.presets');
    [[1, '1 Min.'], [3, '3 Min.'], [5, '5 Min.'], [10, '10 Min.'], [15, '15 Min.'], [25, '25 Min.'], [60, '1 Std.']].forEach(function (p) {
      presets.appendChild(el('button.chip', { type: 'button', text: p[1], onclick: function () { if (TM.run) return; TM.total = TM.left = p[0] * 60000; paint(); tick(); } }));
    });
    var bStart = el('button.btn.primary', { type: 'button' }), bReset = el('button.btn', { type: 'button', text: 'Zurücksetzen' });
    pane.append(el('div.ring', null, svg, big), presets, el('div.btns', null, bReset, bStart));
    var left = function () { return TM.run ? TM.end - Date.now() : TM.left; };
    var paint = function () { bStart.textContent = TM.run ? 'Anhalten' : TM.left < TM.total ? 'Weiter' : 'Start'; presets.style.opacity = TM.run ? .4 : 1; };
    bStart.onclick = function () {
      if (TM.run) { TM.left = left(); TM.run = false; clearTimeout(TM.done); }
      else { TM.end = Date.now() + TM.left; TM.run = true; TM.done = setTimeout(ring, TM.left); }
      paint();
    };
    bReset.onclick = function () { TM.run = false; clearTimeout(TM.done); TM.left = TM.total; paint(); tick(); };
    var tick = function () {
      var l = left();
      big.textContent = fmtMs(Math.ceil(l / 1000) * 1000);
      arc.setAttribute('stroke-dashoffset', String(C * (1 - Math.max(0, l) / TM.total)));
    };
    paint(); tick(); timer = setInterval(tick, 200);
  }
  function ring() {
    TM.run = false; TM.left = TM.total;
    A.notify({ title: 'Timer abgelaufen', body: fmtMs(TM.total) + ' sind um.', app: A.HX && A.HX.apps.get('sys:clock') });
    if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]);
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, .35, .7].forEach(function (t) { var o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(.2, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + t + .3); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .3); });
    } catch (e) { }
    if (cur === 'timer') render();
  }
  window.hxDirty = function () { return SW.run || TM.run; };
  render();
})();
</script>
</body>
</html>
