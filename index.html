<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0B1020">
<title>Helix</title>
<link rel="icon" href="icons/helix.svg">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/shell.css">
</head>
<body>
<div id="boot" aria-hidden="true"><svg viewBox="0 0 32 32"><g class="s1"><path d="M10 4c0 6 12 6 12 12s-12 6-12 12" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round"/><path d="M22 4c0 6-12 6-12 12s12 6 12 12" fill="none" stroke="#F6C08C" stroke-width="3" stroke-linecap="round"/></g><circle cx="16" cy="16" r="2.2" fill="#fff"/></svg></div>
<div id="wallpaper"></div>

<header id="panel">
  <div id="p-left"><button id="p-overview" type="button" aria-label="Übersicht"></button><span id="p-active" hidden></span><span id="p-win" hidden></span></div>
  <button id="p-clock" type="button" aria-label="Kalender und Benachrichtigungen"></button>
  <button id="p-status" type="button" aria-label="Schnelleinstellungen"></button>
</header>

<main id="desk"></main>
<div id="windows"></div>

<div id="overview" hidden>
  <div class="ov-top"><div class="search ov-search"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span><input id="ov-q" type="search" placeholder="Apps suchen" autocomplete="off" spellcheck="false"></div></div>
  <div id="ov-empty" class="ov-empty">Keine offenen Fenster</div>
</div>

<div id="launcher" hidden>
  <div class="launch-inner">
    <div class="search"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span><input id="launch-q" type="search" placeholder="Apps suchen" autocomplete="off" spellcheck="false"></div>
    <div id="launch-list"></div>
  </div>
</div>

<nav id="dock" aria-label="Dock"></nav>
<div id="toasts" aria-live="polite"></div>

<script src="js/icons.js"></script>
<script src="js/hx.js"></script>
<script src="js/apps.js"></script>
<script src="js/wm.js"></script>
<script src="js/shell.js"></script>
</body>
</html>
